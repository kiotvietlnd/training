    <script src="https://cdn.tailwindcss.com"></script>

            padding: 0; 
            overflow: hidden; 
            -webkit-overflow-scrolling: touch;
        }

            outline: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .sidebar-item-btn { transition: all 0.15s ease; outline: none !important; }
        .sidebar-item-btn.active-lesson { background-color: #166def !important; color: #ffffff !important; font-weight: 700; }

        .sidebar-item-btn.active-lesson i.check-icon { color: #86efac !important; }

        #app-sidebar {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;

            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);

        }
        .side-nav-btn:active:not(:disabled) {

        }

            .safe-bottom-padding {

            }

<body class="text-slate-800 antialiased flex flex-col h-[100dvh] w-screen bg-[#f1f5f9] overflow-hidden select-none">

        <div class="flex items-center gap-1.5 sm:gap-2 truncate">
            <button onclick="toggleSidebarCollapse()" class="w-7 h-7 rounded-lg bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-all cursor-pointer shrink-0" title="Danh mục">
                <i id="sidebar-toggle-icon" class="fa-solid fa-bars-staggered text-xs"></i>
            </button>
            
            <button onclick="openSettingsModal()" class="w-7 h-7 rounded-lg bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-all cursor-pointer shrink-0" title="Cài đặt thu phóng">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>

            <span class="text-white/40 text-xs sm:text-sm font-light">|</span>
            <div class="truncate">
                <h1 class="text-xs sm:text-sm font-black tracking-tight text-white uppercase truncate">Hướng Dẫn Học LMS</h1>
            </div>
        </div>

        <div class="shrink-0 font-bold px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full text-[10px] sm:text-[11px] text-white shadow-xs bg-cyan-400 border border-cyan-400/40 uppercase tracking-wider">
            LMS Guide
        </div>
    </header>

    <!-- KHUNG BODY CHÍNH -->

        <!-- LỚP BACKDROP MỜ TRÊN MOBILE -->
        <div id="sidebar-backdrop" onclick="toggleSidebarCollapse()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-2xs transition-opacity"></div>

        <!-- SIDEBAR GỌN GÀNG, KHÔNG RƯỜM RÀ -->
        <aside id="app-sidebar" class="fixed md:static inset-y-0 left-0 z-50 md:z-20 w-64 sm:w-60 lg:w-64 bg-white border-r border-slate-200 shrink-0 h-full flex flex-col shadow-xl md:shadow-xs overflow-hidden -translate-x-full md:translate-x-0">
            <div class="md:hidden h-10 px-3 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">
                <span class="text-xs font-black text-slate-700 uppercase tracking-wider">Nội dung hướng dẫn</span>
                <button onclick="toggleSidebarCollapse()" class="w-6 h-6 rounded-md text-slate-400 hover:text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="p-2 space-y-1.5 overflow-y-auto flex-1 custom-scrollbar">
                <!-- QUY ĐỊNH HỌC TẬP -->
                <button onclick="navGoToPage('intro-overview')" id="btn-intro-overview" class="sidebar-item-btn active-lesson w-full flex items-center gap-2 px-2.5 py-2 rounded-xl text-slate-700 hover:bg-slate-100 text-xs font-semibold cursor-pointer">

                    <span class="truncate flex-1 text-left font-bold">Quy định học tập</span>
                </button>

                <div class="pt-1 pb-0.5 px-2">
                    <div class="h-px bg-slate-200 w-full"></div>
                </div>

                <!-- 5 CỤM ACCORDION GẬP MỞ -->
                <div id="sidebar-accordion-container" class="space-y-1.5"></div>
            </div>
        </aside>

        <!-- MAIN CONTENT CHÍNH -->
        <main class="flex-1 min-w-0 h-full relative overflow-hidden flex flex-col bg-[#f8fafc]">
            
            <!-- NÚT MŨI TÊN TRÁI -->
            <button id="nav-btn-prev" onclick="navStepLinear('prev')" class="side-nav-btn absolute left-1 sm:left-3 top-1/2 -translate-y-1/2 z-30 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/95 hover:bg-white text-slate-700 hover:text-[#166def] border border-slate-200 flex items-center justify-center cursor-pointer disabled:opacity-0 disabled:pointer-events-none" title="Trang trước">
                <i class="fa-solid fa-arrow-left text-[11px] sm:text-sm font-black"></i>
            </button>

            <!-- NÚT MŨI TÊN PHẢI -->
            <button id="nav-btn-next" onclick="navStepLinear('next')" class="side-nav-btn absolute right-1 sm:right-3 top-1/2 -translate-y-1/2 z-30 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-[#166def] hover:bg-[#1259c7] text-white flex items-center justify-center cursor-pointer" title="Trang tiếp">

            </div>
        </main>

    </div>

    <!-- MODAL THU PHÓNG ZOOM: MẶC ĐỊNH 100%, 110%, 120%, 130% -->
    <div id="modal-settings" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-3 backdrop-blur-xs">

                </div>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 text-sm cursor-pointer">

                </div>
                <p class="text-[10px] text-slate-500 italic">Mặc định 100% giúp hình ảnh và chữ hiển thị to rõ, sắc nét.</p>

            <div class="pt-2">

            </div>
        </div>
    </div>

        let currentPage = 'intro-overview';
        let currentZoom = 100;
        let isSidebarCollapsed = false;
        let viewedPages = new Set(['intro-overview']);
        let openCategories = new Set(['cat_login']);

        function isMobile() {
            return window.innerWidth < 768;
        }

        function getLinearNavigationList() {
            let list = [
                { id: 'intro-overview', title: 'Quy định học tập' }
            ];

            CATEGORIES_DATA.forEach(cat => {
                cat.lessons.forEach(lesson => {
                    list.push({ id: lesson.id, title: lesson.title, catId: cat.id, catName: cat.name });
                });
            });

            return list;
        }

        document.addEventListener("DOMContentLoaded", function() {
            setAppZoom(100);
            renderSidebar();
            navGoToPage('intro-overview');

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeImageLightbox();
                    closeSettingsModal();
                    closeModal('modal-completed');
                }
            });
        });

        function setAppZoom(val) {
            currentZoom = val;
            const fontMap = { 
                100: '15px', 
                110: '16.5px', 
                120: '18px', 
                130: '19.5px' 
            };
            document.documentElement.style.fontSize = fontMap[val] || '15px';
            document.getElementById('zoom-label').innerText = val + '%';
            
            document.querySelectorAll('.zoom-btn').forEach(b => {
                if (parseInt(b.getAttribute('data-zoom')) === val) {
                    b.className = 'zoom-btn py-2 px-2 rounded-xl text-xs font-bold border-2 border-[#166def] bg-blue-50 text-[#166def] cursor-pointer';
                } else {
                    b.className = 'zoom-btn py-2 px-2 rounded-xl text-xs font-bold border border-slate-200 hover:bg-slate-50 cursor-pointer text-slate-700';
                }
            });
        }

        function openImageLightbox(src, caption) {
            const modal = document.getElementById('modal-image-lightbox');
            const imgEl = document.getElementById('lightbox-img');
            const capEl = document.getElementById('lightbox-caption');
            if (modal && imgEl) {
                imgEl.src = src;
                capEl.innerText = caption ? caption.replace(/<[^>]*>?/gm, '') : '';
                modal.classList.remove('hidden');
            }
        }

        function closeImageLightbox() {
            const modal = document.getElementById('modal-image-lightbox');
            if (modal) modal.classList.add('hidden');
        }

        function openSettingsModal() { document.getElementById('modal-settings').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('modal-settings').classList.add('hidden'); }

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('app-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const icon = document.getElementById('sidebar-toggle-icon');

            if (isMobile()) {
                const isOpen = !sidebar.classList.contains('-translate-x-full');
                if (isOpen) {
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.add('hidden');
                    icon.className = 'fa-solid fa-bars-staggered text-xs';
                } else {
                    sidebar.classList.remove('-translate-x-full');
                    backdrop.classList.remove('hidden');
                    icon.className = 'fa-solid fa-xmark text-xs';
                }
            } else {
                isSidebarCollapsed = !isSidebarCollapsed;
                if (isSidebarCollapsed) {
                    sidebar.style.width = '0px';
                    sidebar.style.transform = 'translateX(-100%)';
                    sidebar.style.opacity = '0';
                    icon.className = 'fa-solid fa-arrow-right-to-bracket text-xs';
                } else {
                    sidebar.style.width = '';
                    sidebar.style.transform = 'translateX(0)';
                    sidebar.style.opacity = '1';
                    icon.className = 'fa-solid fa-bars-staggered text-xs';
                }
            }
        }

        function toggleCategoryAccordion(catId) {
            if (openCategories.has(catId)) {
                openCategories.delete(catId);
            } else {
                openCategories.add(catId);
            }
            renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-accordion-container');
            if (!container) return;

            container.innerHTML = CATEGORIES_DATA.map((cat) => {
                const isOpen = openCategories.has(cat.id);
                const hasActiveChild = cat.lessons.some(l => l.id === currentPage);

                return `
                    <div class="rounded-xl border ${hasActiveChild ? 'border-blue-200 bg-blue-50/30' : 'border-slate-200/80 bg-white'} overflow-hidden transition-all">
                        <button onclick="toggleCategoryAccordion('${cat.id}')" class="w-full flex items-center justify-between px-2.5 py-2 text-slate-800 hover:bg-slate-50 text-xs font-bold cursor-pointer select-none">
                            <div class="flex items-center gap-2 truncate">
                                <i class="fa-solid ${cat.icon} text-xs text-[#166def] shrink-0"></i>
                                <span class="truncate text-[11.5px] uppercase tracking-wide font-black ${hasActiveChild ? 'text-[#166def]' : 'text-slate-700'}">${cat.name}</span>
                            </div>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200 shrink-0 ${isOpen ? 'rotate-180 text-[#166def]' : ''}"></i>
                        </button>

                        <div class="${isOpen ? 'block' : 'hidden'} px-1.5 pb-1.5 pt-0.5 space-y-1 bg-white/60 border-t border-slate-100">
                            ${cat.lessons.map(lesson => {
                                const isViewed = viewedPages.has(lesson.id);
                                const isActive = (currentPage === lesson.id);
                                return `
                                    <button onclick="navGoToPage('${lesson.id}')" class="sidebar-item-btn w-full text-left px-2 py-1.5 rounded-lg text-xs flex items-center justify-between gap-1.5 cursor-pointer leading-tight ${isActive ? 'active-lesson text-white' : 'text-slate-600 hover:bg-slate-100 font-medium'}">
                                        <span class="truncate flex-1 text-[11px]">${lesson.sidebarTitle}</span>
                                        ${isViewed ? `<i class="fa-solid fa-circle-check check-icon text-emerald-500 text-[11px] shrink-0" title="Đã xem"></i>` : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            const introBtn = document.getElementById('btn-intro-overview');
            if (introBtn) {
                if (currentPage === 'intro-overview') {
                    introBtn.className = 'sidebar-item-btn active-lesson w-full flex items-center gap-2 px-2.5 py-2 rounded-xl text-white font-bold cursor-pointer';
                } else {
                    introBtn.className = 'sidebar-item-btn w-full flex items-center gap-2 px-2.5 py-2 rounded-xl text-slate-700 hover:bg-slate-100 text-xs font-semibold cursor-pointer';
                }
            }
        }

        function updateSideNavButtons() {
            const list = getLinearNavigationList();
            const curIdx = list.findIndex(item => item.id === currentPage);
            const prevBtn = document.getElementById('nav-btn-prev');
            const nextBtn = document.getElementById('nav-btn-next');
            if (!prevBtn || !nextBtn) return;

            if (curIdx <= 0) {
                prevBtn.disabled = true;
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.disabled = false;
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function navGoToPage(pageId) {
            currentPage = pageId;
            viewedPages.add(pageId);

            CATEGORIES_DATA.forEach(cat => {
                if (cat.lessons.some(l => l.id === pageId)) {
                    openCategories.add(cat.id);
                }
            });

            renderSidebar();
            renderCurrentPageView();
            updateSideNavButtons();
            
            if (isMobile()) {
                const sidebar = document.getElementById('app-sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                const icon = document.getElementById('sidebar-toggle-icon');
                if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.add('hidden');
                    if (icon) icon.className = 'fa-solid fa-bars-staggered text-xs';
                }
            }

            const container = document.getElementById('dynamic-content-view');
            if (container) container.scrollTop = 0;
        }

        function navStepLinear(direction) {
            const list = getLinearNavigationList();
            const curIdx = list.findIndex(item => item.id === currentPage);
            if (curIdx === -1) return;

            if (direction === 'next') {
                if (curIdx === list.length - 1) {
                    document.getElementById('modal-completed').classList.remove('hidden');
                    return;
                }
                const nextItem = list[curIdx + 1];
                navGoToPage(nextItem.id);
            } else if (direction === 'prev') {
                if (curIdx > 0) {
                    const prevItem = list[curIdx - 1];
                    navGoToPage(prevItem.id);
                }
            }
        }

        function restartFromBeginning() {
            closeModal('modal-completed');
            navGoToPage('intro-overview');
        }

                }
            }

            if (currentLesson) {
                const list = getLinearNavigationList();
                const isLast = (list[list.length - 1].id === currentLesson.id);

                container.innerHTML = `
                    <div class="w-full max-w-5xl mx-auto space-y-4 pb-16 md:pb-6">
                        <!-- HEADER BÀI HỌC -->
                        <div class="space-y-1 border-b border-slate-200 pb-2.5">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-0.5 text-[10px] font-black text-white rounded-full uppercase tracking-wider bg-[#166def]">
                                    ${currentCategory.name}
                                </span>
                                <i class="fa-solid fa-circle-check text-emerald-500 text-sm" title="Đang học"></i>
                            </div>
                            <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
                                <span>${currentLesson.title}</span>
                            </h2>
                        </div>

                        <!-- BỐI CẢNH / MỤC TIÊU -->
                        <div class="p-3.5 sm:p-4 rounded-xl bg-gradient-to-r from-amber-50 via-orange-50/80 to-amber-50/50 border-2 border-amber-300 shadow-2xs space-y-1.5">
                            <div class="flex items-center gap-2 text-amber-900">
                                <div class="w-5 h-5 rounded-md bg-amber-500 text-white flex items-center justify-center text-[11px] shadow-xs shrink-0">
                                    <i class="fa-solid fa-bullseye"></i>
                                </div>
                                <h3 class="text-xs font-black uppercase tracking-wider text-amber-900">Mục tiêu thao tác:</h3>
                            </div>
                            <p class="text-xs sm:text-sm text-amber-950 leading-relaxed font-medium pl-7">${currentLesson.situation}</p>
                        </div>

                        <!-- CÁC BƯỚC THAO TÁC + HÌNH ẢNH TO VÀ CLICK ĐỂ PHÓNG TO -->
                        <div class="space-y-3 pt-1">
                            <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Quy trình thực hiện:</h3>
                            <div class="space-y-4">
                                ${currentLesson.steps.map((step, sIdx) => `
                                    <div class="space-y-2.5 bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-2xs">
                                        <div class="flex items-start gap-2.5">
                                            <span class="w-5 h-5 rounded-full text-white text-[11px] font-black flex items-center justify-center shrink-0 mt-0.5 shadow-2xs bg-[#166def]">${sIdx + 1}</span>
                                            <div class="text-xs sm:text-sm text-slate-700 leading-relaxed font-bold">${step.text}</div>
                                        </div>
                                        ${step.img ? `
                                            <div onclick="openImageLightbox('${step.img}', '${step.text.replace(/'/g, "\\'")}')" 
                                                 class="relative group rounded-xl overflow-hidden border border-slate-200 shadow-xs bg-slate-100 flex items-center justify-center p-1.5 sm:p-3 cursor-zoom-in transition-all hover:border-[#166def]/60 hover:shadow-md">
                                                <img src="${step.img}" alt="Hình ảnh bước ${sIdx + 1}" class="w-full h-auto object-contain select-none max-h-[680px] mx-auto rounded-lg transition-transform group-hover:scale-[1.008]">
                                                
                                                <div class="absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-lg bg-black/60 hover:bg-black/80 text-white text-[11px] font-semibold flex items-center gap-1.5 backdrop-blur-xs transition-opacity shadow-md pointer-events-none opacity-85 group-hover:opacity-100">
                                                    <i class="fa-solid fa-expand text-[10px]"></i> Bấm để phóng to
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- NÚT HOÀN THÀNH Ở CUỐI TRANG CUỐI -->
                        ${isLast ? `
                            <div class="pt-4">
                                <div onclick="document.getElementById('modal-completed').classList.remove('hidden')" 
                                     class="w-full p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-[#166def] via-teal-600 to-[#16a34a] text-white cursor-pointer shadow-md transition-all hover:scale-[1.005] active:scale-[0.99] flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-xs flex items-center justify-center text-xl shrink-0 shadow-xs">
                                            <i class="fa-solid fa-trophy text-amber-300"></i>
                                        </div>
                                        <div>
                                            <h4 class="text-xs sm:text-base font-black uppercase tracking-tight text-white">Bạn đã xem hết nội dung hướng dẫn!</h4>
                                            <p class="text-[11px] sm:text-xs text-white/90 font-medium mt-0.5">Bấm vào đây để hoàn tất.</p>
                                        </div>
                                    </div>
                                    <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                                        <i class="fa-solid fa-chevron-right text-xs"></i>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                    </div>
                `;
            }
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
