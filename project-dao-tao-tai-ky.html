<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Đào tạo Tái ký - KiotViet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif;
            color: #334155; 
            background-color: #f8fafc;
            overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* --- BACKGROUND NHƯ TEMPLATE --- */
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #f8fafc; pointer-events: none;}
        .glow-blob-1, .glow-blob-2 { 
            position: absolute; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; 
            transition: background 1.2s ease-in-out;
        }
        .glow-blob-1 { top: -10%; left: -10%; background: rgba(14, 165, 233, 0.12); } 
        .glow-blob-2 { bottom: -10%; right: -10%; background: rgba(30, 58, 138, 0.1); } 

        /* --- HIỆU ỨNG TEXT --- */
        @keyframes gradientPan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .cyber-text-gradient {
            background-size: 200% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            background-image: linear-gradient(90deg, #0ea5e9, #1e40af, #38bdf8, #1d4ed8);
            animation: gradientPan 8s linear infinite;
        }

        /* --- GLASS PANEL & SHADOWS --- */
        .glass-panel-ultra {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.8));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        /* --- TIMELINE CHUẨN (CĂN CHỈNH CHO ICON GẤP ĐÔI) --- */
        /* Trên Mobile (Icon size: w-20 = 5rem -> tâm là 2.5rem) */
        .timeline-line {
            position: absolute;
            top: 4rem;
            bottom: -1rem;
            left: calc(2.5rem - 1px); 
            width: 2px;
            background: linear-gradient(to bottom, #cbd5e1, #e2e8f0);
            z-index: 0;
        }
        
        /* Trên Desktop (Icon size: w-24 = 6rem -> tâm là 3rem) */
        @media (min-width: 640px) {
            .timeline-line {
                left: calc(3rem - 1px);
            }
        }
        
        .timeline-item:last-child .timeline-line { display: none; }

        .timeline-item { animation: fadeInUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) both; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- BUTTONS "SCIFI" CỦA TEMPLATE --- */
        .scifi-btn {
            position: relative; display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13px;
            background: rgba(255, 255, 255, 0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none; border: 1px solid #e2e8f0; color: #475569;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            cursor: pointer;
        }
        .scifi-btn:hover { transform: scale(1.03) translateY(-2px); border-color: transparent; }
        .sc-retail { color: #0284c7; } .sc-retail:hover { background: #f0f9ff; box-shadow: 0 8px 20px -8px rgba(2,132,199,0.3); }
        .sc-fnb { color: #ea580c; } .sc-fnb:hover { background: #fff7ed; box-shadow: 0 8px 20px -8px rgba(234,88,12,0.3); }

        /* Accent thẻ (màu viền nhạt bên trái) */
        .card-accent-all { border-left: 4px solid #6366F1; }
        .card-accent-admin { border-left: 4px solid #E11D48; }
        .card-accent-learner { border-left: 4px solid #0284C7; }
        .card-accent-trainer { border-left: 4px solid #10B981; }
        .card-accent-sm { border-left: 4px solid #D97706; }

    </style>
</head>
<body id="top">

    <!-- BACKGROUND EFFECTS -->
    <div class="tech-bg">
        <div class="glow-blob-1"></div>
        <div class="glow-blob-2"></div>
    </div>

    <!-- HEADER NAVBAR -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/50 h-16 lg:h-20 flex items-center shadow-sm sticky top-0 z-50 transition-all">
        <div class="max-w-[1300px] mx-auto px-5 lg:px-8 w-full flex items-center gap-3 lg:gap-4">
            <img src="https://cdn-kvweb-website.kiotviet.vn/images/v2/giai-phap/logos/kiotviet-logo-horizontal.svg" alt="KiotViet Logo" class="h-6 lg:h-8">
            <span class="text-slate-300 font-light text-xl lg:text-2xl">|</span>
            <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-500 to-blue-800 tracking-tight text-sm lg:text-lg uppercase">
                Project Đào tạo Tái ký
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-[1300px] w-full mx-auto px-5 lg:px-8 py-10 lg:py-16">
        
        <!-- HEADER BLOCK TƯƠNG TỰ TEMPLATE -->
        <section class="mb-12">
            <div class="flex flex-col items-center text-center gap-3">
                <div class="w-16 h-16 bg-gradient-to-br from-sky-500 to-blue-700 rounded-[20px] flex items-center justify-center text-3xl text-white shadow-lg shadow-sky-200 shrink-0 mb-2">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h1 class="text-[2rem] lg:text-[3rem] font-black text-slate-800 leading-tight tracking-tight">
                    Project Đào tạo <span class="cyber-text-gradient drop-shadow-sm">Tái Ký</span>
                </h1>
                <p class="text-slate-500 font-medium max-w-xl text-[15px]">
                    Theo dõi trực quan toàn bộ tiến trình công việc, tài liệu và hệ thống quản lý học viên theo thời gian thực.
                </p>
            </div>
        </section>

        <!-- BỘ LỌC -->
        <section class="mb-12 relative z-20">
            <div class="bg-white/80 glass-panel-ultra border border-slate-200 rounded-[28px] p-6 lg:p-8 shadow-sm max-w-[1000px] mx-auto flex flex-col md:flex-row gap-8 items-center justify-between">
                
                <!-- Lọc Ngành -->
                <div class="w-full md:w-auto">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-3">Chọn ngành phụ trách:</span>
                    <div class="flex gap-2.5">
                        <button id="b-all" onclick="setBranch('all')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-sky-500 bg-sky-500 text-white shadow-md">
                            Tất cả
                        </button>
                        <button id="b-retail" onclick="setBranch('retail')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-slate-200 text-slate-600 bg-white hover:border-sky-300 hover:text-sky-600">
                            Retail
                        </button>
                        <button id="b-fnb" onclick="setBranch('fnb')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-slate-200 text-slate-600 bg-white hover:border-orange-400 hover:text-orange-600">
                            FNB
                        </button>
                    </div>
                </div>

                <!-- Lọc Đối tượng -->
                <div class="w-full md:w-auto">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-3 text-left md:text-right">Tập trung tác vụ:</span>
                    <div class="flex flex-wrap gap-2.5 justify-start md:justify-end">
                        <button id="f-all" onclick="setFocus('all')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-slate-800 bg-slate-800 text-white shadow-md">
                            Hiển thị (11)
                        </button>
                        <button id="f-trainer" onclick="setFocus('trainer')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-slate-200 text-slate-600 bg-white hover:border-emerald-500 hover:text-emerald-600">
                            <i class="fa-solid fa-chalkboard-user mr-1"></i> Trainer
                        </button>
                        <button id="f-learner" onclick="setFocus('learner')" class="px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all border-slate-200 text-slate-600 bg-white hover:border-sky-400 hover:text-sky-600">
                            <i class="fa-solid fa-user-graduate mr-1"></i> Học viên
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- TIMELINE CONTAINER -->
        <section class="max-w-[1000px] mx-auto relative px-4 md:px-10 py-10 mb-20 bg-white/40 backdrop-blur-md border border-slate-200/80 rounded-[32px] shadow-sm overflow-visible">
            <div id="timeline-root" class="relative">
                <!-- Data Rendered Here -->
            </div>
        </section>

    </main>

    <script>
        const timelineData = [
            {
                id: 1, role: "All", code: "all",
                icon: "fa-solid fa-map", title: "Khởi động: Cập nhật Thời Khóa Biểu",
                desc: "Nắm bắt thông tin All-in-one, danh sách lớp học và lịch trình trong tuần.",
                retail: [{ name: "TKB Retail Tuần 1", url: "https://kiotvietlnd.github.io/training/tkb-tai-ky-tuan-1" }],
                fnb: [{ name: "TKB FNB Tuần 1", url: "https://kiotvietlnd.github.io/training/tkb-tai-ky-tuan-1" }]
            },
            {
                id: 2, role: "Admin", code: "admin",
                icon: "fa-solid fa-gears", title: "Hệ thống phân công Reviewer",
                desc: "Điền danh sách ứng viên & giảng viên. Dùng công cụ tự động đổ lịch vào sheet Review Calendar.",
                retail: [], fnb: []
            },
            {
                id: 3, role: "Trainer", code: "trainer",
                icon: "fa-regular fa-calendar-check", title: "Tạo & gửi Lịch Google Meet",
                desc: "Lấy email Học viên để Add lịch Calendar & Cập nhật Sheet Review. Giữ nguyên 1 link Google Meet duy nhất.",
                retail: [], fnb: []
            },
            {
                id: 4, role: "Học viên", code: "learner",
                icon: "fa-solid fa-book-open", title: "Nghiên cứu Lý thuyết",
                desc: "Học viên tự xem Infographic, lý thuyết sản phẩm và trả lời câu hỏi phụ trên Github.",
                retail: [{ name: "Học liệu Retail", url: "https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/dao-tao-san-pham-retail" }],
                fnb: [{ name: "Học liệu FNB", url: "https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/dao-tao-san-pham-fnb" }]
            },
            {
                id: 5, role: "Học viên", code: "learner",
                icon: "fa-solid fa-pen-nib", title: "Làm Test Trắc nghiệm",
                desc: "Làm bài trắc nghiệm nhanh để củng cố kiến thức từng phần.",
                retail: [
                    { name: "1A", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/retail-tk1a" }, 
                    { name: "1B", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/retail-tk1b" }, 
                    { name: "2A", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/retail-tk2a" }, 
                    { name: "2B", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/retail-tk2b" },
                    { name: "3",  url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/ke-toan-01" }
                ],
                fnb: [
                    { name: "1A", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/fnb-tk1a" }, 
                    { name: "1B", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/fnb-tk1b" }, 
                    { name: "2A", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/fnb-tk2a" }, 
                    { name: "2B", url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/fnb-tk2b" },
                    { name: "3",  url: "https://kiotvietlnd.github.io/quiz/khoa-hoc/ke-toan-01" }
                ]
            },
            {
                id: 6, role: "Học viên", code: "learner",
                icon: "fa-solid fa-camera", title: "Thực hành & Chụp ảnh",
                desc: "Thao tác trực tiếp trên phần mềm KiotViet, chụp ảnh màn hình và nộp minh chứng.",
                retail: [{ name: "Nộp bài Retail", url: "https://kiotvietlnd.github.io/quiz/thuc-hanh/tai-ky/" }],
                fnb: [{ name: "Nộp bài FNB", url: "https://kiotvietlnd.github.io/quiz/thuc-hanh/tai-ky/" }]
            },
            {
                id: 7, role: "Trainer", code: "trainer",
                icon: "fa-solid fa-clipboard-check", title: "Kiểm tra trạng thái bài nộp",
                desc: "Trước khi vào Meet, Trainer check xem học viên đã nộp đủ ảnh thực hành chưa.",
                retail: [{ name: "View Dashboard Trainer", url: "https://kiotvietlnd.github.io/quiz/thuc-hanh/tai-ky/view-giang-vien.html" }],
                fnb: [{ name: "View Dashboard Trainer", url: "https://kiotvietlnd.github.io/quiz/thuc-hanh/tai-ky/view-giang-vien.html" }]
            },
            {
                id: 8, role: "Học viên", code: "learner",
                icon: "fa-regular fa-lightbulb", title: "Chuẩn bị Tình huống",
                desc: "Đọc trước các ca tình huống khó (không có đáp án) để phản xạ khi bị Reviewer hỏi.",
                retail: [{ name: "Tình huống Retail", url: "https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/tinh-huong-on-tap-retail" }],
                fnb: [{ name: "Tình huống FNB", url: "https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/tinh-huong-on-tap-fnb" }]
            },
            {
                id: 9, role: "Trainer", code: "trainer",
                icon: "fa-solid fa-video", title: "Tiến hành Review Live",
                desc: "Dùng tool Review để: Nhập tên HV > Xem bài > Bốc đề ngẫu nhiên > Ghi nhận kết quả.",
                retail: [{ name: "Mở Tool Review", url: "https://kiotvietlnd.github.io/quiz/review-tai-ky/trainer" }],
                fnb: [{ name: "Mở Tool Review", url: "https://kiotvietlnd.github.io/quiz/review-tai-ky/trainer" }]
            },
            {
                id: 10, role: "SM", code: "sm",
                icon: "fa-solid fa-chart-line", title: "Đồng bộ Báo cáo",
                desc: "SM Tái ký & team LND theo dõi bảng điểm tổng kết để ra quyết định.",
                retail: [{ name: "Xem Báo cáo", url: "https://sites.google.com/kiotviet.com/review-sp-tai-ky/home" }],
                fnb: [{ name: "Xem Báo cáo", url: "https://sites.google.com/kiotviet.com/review-sp-tai-ky/home" }]
            },
            {
                id: 11, role: "Học viên", code: "learner",
                icon: "fa-solid fa-trophy", title: "Thi tốt nghiệp LMS",
                desc: "Hoàn thành Test cuối khóa trên LMS (40 câu, Đạt ≥80%, tối đa 2 lần).",
                retail: [{ name: "Làm bài LMS Retail", url: "https://daotao.kiotviet.vn/khoa-hoc/tai-ky-dao-tao-san-pham-kiotviet-retail/" }],
                fnb: [{ name: "Làm bài LMS FNB", url: "https://daotao.kiotviet.vn/khoa-hoc/tai-ky-dao-tao-san-pham-kiotviet-fnb/" }]
            }
        ];

        // Màu sắc phân cấp
        const colors = {
            'all': { bg: 'bg-indigo-50 border-indigo-100', text: 'text-indigo-700', icon: 'bg-gradient-to-br from-indigo-500 to-blue-600' },
            'admin': { bg: 'bg-rose-50 border-rose-100', text: 'text-rose-700', icon: 'bg-gradient-to-br from-rose-500 to-red-600' },
            'learner': { bg: 'bg-sky-50 border-sky-100', text: 'text-sky-700', icon: 'bg-gradient-to-br from-sky-400 to-blue-600' },
            'trainer': { bg: 'bg-emerald-50 border-emerald-100', text: 'text-emerald-700', icon: 'bg-gradient-to-br from-emerald-400 to-teal-600' },
            'sm': { bg: 'bg-amber-50 border-amber-100', text: 'text-amber-700', icon: 'bg-gradient-to-br from-amber-400 to-orange-500' }
        };

        let currentBranch = 'all';
        let currentFocus = 'all';

        function render() {
            const root = document.getElementById('timeline-root');
            let html = '';
            let displayIndex = 1;

            timelineData.forEach((item) => {
                // Logic Filter
                const isVisible = (currentFocus === 'all' || item.code === currentFocus || item.code === 'all');
                if (!isVisible) return; 

                const theme = colors[item.code];
                
                // Logic Ngành
                const showRetail = (currentBranch === 'all' || currentBranch === 'retail') && item.retail.length > 0;
                const showFnb = (currentBranch === 'all' || currentBranch === 'fnb') && item.fnb.length > 0;

                // Buttons (sử dụng style scifi-btn từ template)
                let btns = '';
                if (showRetail) {
                    btns += item.retail.map(r => `
                        <a href="${r.url}" target="_blank" class="scifi-btn sc-retail group">
                            <div class="w-6 h-6 rounded-md bg-sky-100 flex items-center justify-center text-[10px] group-hover:bg-white group-hover:shadow transition-all"><i class="fa-solid fa-store"></i></div>
                            ${r.name}
                        </a>
                    `).join('');
                }
                if (showFnb) {
                    btns += item.fnb.map(r => `
                        <a href="${r.url}" target="_blank" class="scifi-btn sc-fnb group">
                            <div class="w-6 h-6 rounded-md bg-orange-100 flex items-center justify-center text-[10px] group-hover:bg-white group-hover:shadow transition-all"><i class="fa-solid fa-utensils"></i></div>
                            ${r.name}
                        </a>
                    `).join('');
                }
                
                const linkArea = btns ? `<div class="mt-5 flex flex-wrap gap-3">${btns}</div>` : '';

                html += `
                <div class="relative flex items-start gap-5 sm:gap-8 timeline-item mb-8">
                    <!-- Trục dọc -->
                    <div class="timeline-line"></div>
                    
                    <!-- Icon khổng lồ + Số thứ tự -->
                    <div class="relative z-10 flex-shrink-0 w-20 h-20 sm:w-24 sm:h-24 rounded-2xl sm:rounded-[24px] flex items-center justify-center border-[4px] sm:border-[6px] border-[#f8fafc] shadow-md ${theme.icon} text-white mt-1">
                        <i class="${item.icon} text-3xl sm:text-4xl drop-shadow-sm"></i>
                        
                        <!-- Huy hiệu đánh số -->
                        <span class="absolute -top-3 -right-3 w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center rounded-full bg-slate-800 text-white text-[12px] sm:text-[14px] font-bold border-[2px] sm:border-[3px] border-[#f8fafc] shadow-sm">
                            ${displayIndex}
                        </span>
                    </div>

                    <!-- Nội dung Thẻ (Glassmorphism & Bo góc) -->
                    <div class="flex-1 bg-white/90 backdrop-blur-md rounded-[24px] shadow-sm border border-slate-200/80 card-accent-${item.code} p-6 transition-all hover:-translate-y-1 hover:shadow-lg hover:border-slate-300 group">
                        
                        <!-- Header thẻ -->
                        <div class="flex items-center gap-2 mb-3">
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${theme.bg} ${theme.text}">
                                ${item.role}
                            </span>
                            ${item.code === 'trainer' ? `<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md flex items-center gap-1 border border-emerald-100"><i class="fa-solid fa-check-double"></i> Việc của bạn</span>` : ''}
                        </div>
                        
                        <h3 class="text-lg sm:text-xl font-black text-slate-800 mb-2 group-hover:text-blue-700 transition-colors">${item.title}</h3>
                        <p class="text-[14px] text-slate-500 font-medium leading-relaxed max-w-2xl">${item.desc}</p>
                        
                        <!-- Links -->
                        ${linkArea}
                    </div>
                </div>
                `;
                
                displayIndex++;
            });
            
            root.innerHTML = html;
        }

        // Action Style cho Filter Buttons
        const baseBtnStyle = "px-5 py-2.5 rounded-xl font-bold border-2 text-xs transition-all";

        function setBranch(val) {
            currentBranch = val;
            const bAll = document.getElementById('b-all');
            const bRet = document.getElementById('b-retail');
            const bFnb = document.getElementById('b-fnb');

            [bAll, bRet, bFnb].forEach(b => b.className = `${baseBtnStyle} border-slate-200 text-slate-600 bg-white`);
            
            if(val === 'all') bAll.className = `${baseBtnStyle} border-sky-500 bg-sky-500 text-white shadow-md`;
            if(val === 'retail') bRet.className = `${baseBtnStyle} border-sky-500 bg-sky-500 text-white shadow-md`;
            if(val === 'fnb') bFnb.className = `${baseBtnStyle} border-orange-500 bg-orange-500 text-white shadow-md`;

            render();
        }

        function setFocus(val) {
            currentFocus = val;
            const fAll = document.getElementById('f-all');
            const fTrn = document.getElementById('f-trainer');
            const fLrn = document.getElementById('f-learner');

            [fAll, fTrn, fLrn].forEach(f => f.className = `${baseBtnStyle} border-slate-200 text-slate-600 bg-white`);
            
            if(val === 'all') fAll.className = `${baseBtnStyle} border-slate-800 bg-slate-800 text-white shadow-md`;
            if(val === 'trainer') fTrn.className = `${baseBtnStyle} border-emerald-600 bg-emerald-600 text-white shadow-md`;
            if(val === 'learner') fLrn.className = `${baseBtnStyle} border-sky-500 bg-sky-500 text-white shadow-md`;

            render();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
